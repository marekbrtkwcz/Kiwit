services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: kiwit-postgres
    environment:
      POSTGRES_USER: kiwit
      POSTGRES_PASSWORD: kiwit_dev_password
      POSTGRES_DB: kiwit
    ports:
      - "5432:5432"
    volumes:
      - kiwit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwit -d kiwit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kiwit_pgdata:
