version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
  exclusions:
    generated: lax
    rules:
      # Common safe-to-ignore error returns: Close/Flush/print helpers.
      - linters: [errcheck]
        text: 'Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked'
      # Tests: unchecked errors in fixtures/helpers are acceptable.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
