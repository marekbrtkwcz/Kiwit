name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiwit
          POSTGRES_PASSWORD: kiwit_test_password
          POSTGRES_DB: kiwit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
      - run: go vet ./...
      - name: Run unit, E2E and dual-engine (SQLite + PostgreSQL) contract tests
        env:
          KIWIT_TEST_POSTGRES_URL: postgres://kiwit:kiwit_test_password@localhost:5432/kiwit_test?sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:ci
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
